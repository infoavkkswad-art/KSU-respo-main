<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawad Swad</title>

  <script>
    (function () {
      var l = window.location;
      var redirect =
        l.pathname +
        l.search +
        l.hash;

      sessionStorage.setItem(
        'github-pages-redirect',
        redirect
      );

      l.replace(
        l.protocol +
        '//' +
        l.host +
        '/'
      );
    })();
  </script>
</head>

<body>
  Loading Kawad Swad...
</body>
</html>
